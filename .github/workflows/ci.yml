name: CI

# Validação pós-merge: roda no push para os branches protegidos.
# A validação pré-merge (em pull_request) fica no ci-quality-gate.yml,
# para não duplicar a execução de lint/build/test em cada PR.
on:
  push:
    branches: [main, develop]

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint roda como verificação INFORMATIVA, não como gate bloqueante.
      # O repositório tem dívida de lint pré-existente (regras @typescript-eslint/no-explicit-any,
      # no-empty-object-type, no-require-imports, no-unused-expressions) em código de tooling e
      # legado: scripts/, supabase/functions/ (Deno, runtime/tsconfig separados), Product.tsx,
      # SEO.tsx, tailwind.config.ts e componentes shadcn em src/components/ui/. Essa dívida é
      # anterior a este fluxo de CI. Deve ser limpa num PR dedicado; ao concluir, remover o
      # `continue-on-error` abaixo para o lint voltar a bloquear (gate rígido).
      - name: Run Lint
        run: npm run lint
        continue-on-error: true

      - name: Run Build
        run: npm run build
        env:
          # Adicione aqui variáveis que sejam obrigatórias para o build, se houver.
          # Geralmente variáveis NEXT_PUBLIC_* podem ser necessárias se houver validação no build.
          NODE_ENV: production

      - name: Run Tests
        run: npm run test
