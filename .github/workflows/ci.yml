name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Build
        run: npm run build
        env:
          # Adicione aqui variáveis que sejam obrigatórias para o build, se houver.
          # Geralmente variáveis NEXT_PUBLIC_* podem ser necessárias se houver validação no build.
          NODE_ENV: production

      - name: Run Tests
        run: npm run test
