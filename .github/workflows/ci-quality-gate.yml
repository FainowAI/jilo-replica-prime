name: CI Quality Gate

# Gate pré-merge: roda em cada pull_request para os branches protegidos.
# A validação pós-merge (em push) fica no ci.yml. Os dois não se sobrepõem,
# evitando rodar lint/build/test em duplicidade.
on:
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint INFORMATIVO (não bloqueia o merge). Ver a nota completa em ci.yml:
      # há dívida de lint pré-existente em tooling e código legado, anterior a este
      # fluxo. Quando essa dívida for limpa num PR dedicado, remover o
      # `continue-on-error` para o lint voltar a ser um gate rígido.
      - name: Run Lint
        run: npm run lint
        continue-on-error: true

      - name: Run Tests
        run: npm test

      - name: Build Check
        run: npm run build
